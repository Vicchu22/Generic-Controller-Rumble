name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hidapi pygame pyinstaller

      # pip install vgamepad normally launches the ViGEmBus driver installer and waits for a
      # person to click through it, which hangs forever on a build server. We download the same
      # package source, remove only that installer call, and install it. The program itself
      # installs the driver on the user's PC when needed.
      - name: Install vgamepad (without its driver installer)
        shell: python
        run: |
          import io, json, pathlib, re, subprocess, sys, tarfile, urllib.request
          meta = json.load(urllib.request.urlopen("https://pypi.org/pypi/vgamepad/0.1.0/json"))
          url = next(u["url"] for u in meta["urls"] if u["packagetype"] == "sdist")
          data = urllib.request.urlopen(url).read()
          tarfile.open(fileobj=io.BytesIO(data)).extractall("vg_src")
          root = next(pathlib.Path("vg_src").iterdir())
          setup = root / "setup.py"
          text = setup.read_text()
          patched = re.sub(r"subprocess\.call\(\['msiexec'.*", "pass", text)
          assert patched != text, "vgamepad setup.py patch did not apply"
          setup.write_text(patched)
          subprocess.check_call([sys.executable, "-m", "pip", "install", str(root)])

      - name: Build exe
        run: pyinstaller --onefile --console --name LivetechRumbleBridge --collect-all vgamepad livetech_bridge.py

      - name: SHA256 checksum
        shell: pwsh
        run: |
          Get-FileHash dist\LivetechRumbleBridge.exe -Algorithm SHA256 | ForEach-Object { $_.Hash } | Out-File dist\LivetechRumbleBridge.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LivetechRumbleBridge
          path: dist/*

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
