name: Build Windows exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CMAKE_GENERATOR: "Visual Studio 17 2022"
      CMAKE_GENERATOR_PLATFORM: "x64"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel cmake
          pip install --no-build-isolation --no-cache-dir hidapi pygame pyinstaller
          pip install --no-build-isolation --no-cache-dir vgamepad==0.1.0
      - name: Build exe
        run: pyinstaller --onefile --console --name LivetechRumbleBridge --collect-all vgamepad livetech_bridge.py
      - name: SHA256 checksum
        shell: pwsh
        run: |
          Get-FileHash dist\LivetechRumbleBridge.exe -Algorithm SHA256 | ForEach-Object { $_.Hash } | Out-File dist\LivetechRumbleBridge.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: LivetechRumbleBridge
          path: dist/*
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
